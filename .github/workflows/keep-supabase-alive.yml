name: Keep Supabase Alive

# 每 5 天自动运行一次，保持 Supabase 项目活跃
# Supabase 免费版会在 7 天无活动后暂停，此任务确保项目不会被暂停
on:
  schedule:
    # 每 5 天的 UTC 时间 02:00 运行 (北京时间 10:00)
    - cron: '0 2 */5 * *'
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Ping Supabase to keep it alive
        run: node scripts/ping-supabase.js

      - name: Report status
        if: always()
        run: |
          echo "Job completed at: $(date)"
          echo "Next scheduled run: In 5 days"
